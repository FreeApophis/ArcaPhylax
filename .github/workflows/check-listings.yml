# Checks third-party plugin listings (catalog/*.json) on pull requests, before they are merged: every listed
# package is downloaded and must match its size and SHA-256, carry a valid signature, match the listing, and be
# signed by the endorsed publisher (site/publishers.json) that owns the plugin id. Needs no secrets.
name: Check plugin listings

on:
  pull_request:
    paths:
      - catalog/**
      - site/publishers.json
      - ArcaPhylax.PluginPackaging/**
      - tools/ArcaPhylax.PluginPack/**
      - .github/workflows/check-listings.yml

permissions:
  contents: read

env:
  ARCAPHYLAX_ROOT_PUBLIC_KEY: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE4u4tJe9ykuuKmaswvCYwP6HY5JgwNxNCxx+UJSKiTDFtjkI88UU9HW2RNgj7DOp9CWgmH8rQL52rTpvYLG/jHw==

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build the pack tool
        run: dotnet build tools/ArcaPhylax.PluginPack/ArcaPhylax.PluginPack.csproj -c Release

      - name: Check listings
        run: |
          dotnet run --project tools/ArcaPhylax.PluginPack -c Release --no-build -- \
            add-listings "$RUNNER_TEMP/catalog.json" catalog \
            --publishers site/publishers.json --root "$ARCAPHYLAX_ROOT_PUBLIC_KEY"
